name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Gallery plugin (optional)
        run: npm install @capacitor-community/media@^6.0.0 || echo "gallery plugin not installed"

      - name: Copy libraries and fonts
        run: |
          mkdir -p www/lib www/fonts
          cp node_modules/html5-qrcode/html5-qrcode.min.js www/lib/
          for w in Regular Medium SemiBold Bold ExtraBold; do
            f=$(find node_modules/vazirmatn -iname "Vazirmatn-$w.woff2" | head -n 1)
            if [ -n "$f" ]; then cp "$f" "www/fonts/Vazirmatn-$w.woff2"; else echo "font $w not found"; fi
          done
          ls -la www/fonts

      - name: Create Android project
        run: npx cap add android

      - name: Android settings (camera, http server)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"#' $F
          cat $F

      - name: Generate app icons
        run: |
          npx capacitor-assets generate --android || echo "icon generation failed"
          # اگر پس‌زمینه آیکن ساخته نشد، خودمان می‌گذاریم
          for d in android/app/src/main/res/mipmap-*; do
            if [ -f "$d/ic_launcher_foreground.png" ] && [ ! -f "$d/ic_launcher_background.png" ]; then
              cp assets/icon-background.png "$d/ic_launcher_background.png"
            fi
          done
          if grep -rl "mipmap/ic_launcher_background" android/app/src/main/res >/dev/null 2>&1 && ! ls android/app/src/main/res/mipmap-*/ic_launcher_background.* >/dev/null 2>&1; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp assets/icon-background.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          fi
          ls android/app/src/main/res/mipmap-*

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Android minSdk 23 (barcode scanner)
        run: sed -i 's/minSdkVersion = 2[0-2]/minSdkVersion = 23/' android/variables.gradle && cat android/variables.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: accessory-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
